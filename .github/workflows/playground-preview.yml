name: Playground Preview

# Builds `wp-graphql-content-blocks.zip` from the PR commit and uploads it
# as a workflow artifact. The sibling `Playground Preview Publish` workflow
# picks the artifact up on `workflow_run` and hosts it, so a preview always
# shows the PR's own build at its latest commit.

on:
  pull_request:
    # Docs, CI, and tests don't change what a reviewer sees in Playground.
    # A workflow-only PR can fire the preview by hand via `workflow_dispatch`.
    paths-ignore:
      - '**.md'
      - '.github/**'
      - 'tests/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Read-only token. The build runs PR code, so it must be treated as
# untrusted. Hosting and commenting happen in the sibling workflow_run
# job under a base-repo token.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.3'
          tools: composer

      # The PR controls this job; `--no-scripts` is not a boundary, the read-only token is.
      - run: composer install --no-dev --no-interaction --no-scripts

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
      - run: npm ci

      # Same packaging as the release job: `plugin-zip` nests everything under
      # `@wpengine/`, so re-zip from inside it to match the shipped archive.
      - name: Build wp-graphql-content-blocks.zip
        run: |
          set -euo pipefail
          npm run build:zip
          mkdir -p build
          unzip -q "@wpengine/wp-graphql-content-blocks.zip" -d build
          (cd build/@wpengine && zip -qr ../wp-graphql-content-blocks.zip wp-graphql-content-blocks/)

      # Cheap smoke test: parse every PHP file in the staged plugin and
      # confirm the entry file and autoloader are present. Catches a `files`
      # list in package.json that drifts out of sync with what the plugin
      # loads — install succeeds but the plugin fatals on first hit.
      - name: Smoke-test the build
        run: |
          set -euo pipefail
          test -f build/@wpengine/wp-graphql-content-blocks/wp-graphql-content-blocks.php
          test -f build/@wpengine/wp-graphql-content-blocks/vendor/autoload.php
          find build/@wpengine/wp-graphql-content-blocks -name '*.php' -print0 \
            | xargs -0 -n1 -P 4 php -l > /dev/null

      # Asserts the blueprint matches the shape the publish workflow rewrites:
      # exactly one URL-resource `installPlugin` of this plugin, WPGraphQL from
      # wordpress.org, and only the step types we expect. Fork PRs can't sneak
      # in steps that pull from attacker URLs because the publish workflow
      # uses the BASE-REF blueprint, but this still catches accidental breakage.
      - name: Schema-validate blueprint
        run: |
          set -euo pipefail
          jq -e '
            (.steps | length > 0)
            and (.steps | all(.step | IN("defineWpConfigConsts", "installPlugin", "runPHP")))
            and (.steps | map(select(.step == "installPlugin" and (.pluginData.resource // "") == "url" and (.pluginData.url | endswith("/wp-graphql-content-blocks.zip")))) | length == 1)
            and (.steps | map(select(.step == "installPlugin" and (.pluginData.resource // "") != "url")) | all(.pluginData.resource == "wordpress.org/plugins" and .pluginData.slug == "wp-graphql"))
          ' blueprint.json > /dev/null

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: build/wp-graphql-content-blocks.zip
          retention-days: 14
          if-no-files-found: error
