name: Release

on:
  push:
    branches:
      - main
  # Rebuilds and attaches the release assets for a tag that already exists,
  # for when the Release job failed after release-please created the release.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to attach assets to (e.g. v4.8.8)'
        required: true

# Serialize runs so overlapping pushes don't race on the release PR branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write      # For creating releases/tags and pushing to the release PR branch
  pull-requests: write # For creating the release PR

jobs:

  call-workflow-test-plugin:
    uses: ./.github/workflows/test-plugin.yml

  release-please:
    name: Release Please
    if: github.event_name == 'push'
    runs-on: ubuntu-22.04
    outputs:
      release-created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
      pr: ${{ steps.release.outputs.pr }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          target-branch: main

  # release-please bumps package.json and package-lock.json but knows nothing
  # about the plugin header, the version constant, the readme.txt Stable tag,
  # or the readme.txt changelog. Sync those onto the release PR branch so they
  # ship together.
  sync-release-files:
    name: Sync release files
    needs: release-please
    if: needs.release-please.outputs.pr
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout release PR branch
        uses: actions/checkout@v7
        with:
          ref: ${{ fromJSON(needs.release-please.outputs.pr).headBranchName }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'

      - name: Update plugin header, version constant, Stable tag, and readme.txt changelog
        run: node bin/versionPlugin.js

      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "Release files already in sync"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: sync release files"
          git push

  release:
    services:
      mariadb:
        image: mariadb:10.8.2
        ports:
          - 3306:3306
        env:
          MYSQL_ROOT_PASSWORD: root
        # Ensure docker waits for mariadb to start
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    name: Release
    needs: [release-please, call-workflow-test-plugin]
    # `!cancelled()` lets a manual run proceed with release-please skipped.
    if: >
      !cancelled()
      && needs.call-workflow-test-plugin.result == 'success'
      && (needs.release-please.outputs.release-created == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-22.04
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || needs.release-please.outputs.tag }}

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - name: Resolve release version
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # A manual run must target a published release, not just any ref.
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build plugin zip
        run: npm run build

      - name: Prepare release zip without parent directory
        run: |
          mkdir -p tmp_release_dir
          unzip -q "@wpengine/wp-graphql-content-blocks.zip" -d tmp_release_dir
          cd tmp_release_dir/@wpengine
          zip -r ../../wp-graphql-content-blocks.zip .
          cd ../..
          rm -rf tmp_release_dir

      - name: Upload plugin zip file
        uses: svenstaro/upload-release-action@29e53e917877a24fad85510ded594ab3c9ca12de # 2.11.5
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: "wp-graphql-content-blocks.zip"
          asset_name: wp-graphql-content-blocks.zip
          tag: ${{ env.TAG }}
          overwrite: true

      - name: Generate info.json manifest
        uses: ./.github/actions/generate-info-json
        with:
          version: ${{ steps.version.outputs.version }}

      - name: Upload info.json to the release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ env.TAG }}
          files: info.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup WordPress to generate static schema
        uses: ./.github/actions/setup-wordpress

      - name: Generate the static schema
        run: |
          cd /tmp/wordpress
          # Output: /tmp/schema.graphql
          wp graphql generate-static-schema

      - name: Upload schema as release artifact
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ env.TAG }}
          files: /tmp/schema.graphql
        env:
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
