version: 2
updates:
  - package-ecosystem: npm
    directory: /
    # Release-please only releases for visible changelog types. Production
    # bumps use `deps` so they reach the release PR's Dependencies section;
    # dev bumps stay `chore` because they don't change what users install.
    commit-message:
      prefix: "deps"
      prefix-development: "chore(deps-dev)"
    schedule:
      interval: weekly
    groups:
      all-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: composer
    directory: /
    # Release-please only releases for visible changelog types. Production
    # bumps use `deps` so they reach the release PR's Dependencies section;
    # dev bumps stay `chore` because they don't change what users install.
    commit-message:
      prefix: "deps"
      prefix-development: "chore(deps-dev)"
    schedule:
      interval: weekly
    groups:
      all-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    commit-message:
      prefix: "ci"
    schedule:
      interval: weekly
    groups:
      all-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
